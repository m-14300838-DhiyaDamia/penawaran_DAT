<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agihan Kursus DAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;600;700;800&display=swap">

<style id="app-css">/* Arah reka bentuk: tema cerah lembut daripada logo UTHM (biru tua) dan JTM (merah-jingga-kuning, kelabu); latar beranimasi perlahan */
:root{
  --navy:#2e3192; --indigo:#4a4fc4; --orange:#f58220; --red:#ee3124; --amber:#fbb040; --grey:#7a7d80;
  --bg:#f4f3fb; --panel:rgba(255,255,255,.80); --panel-solid:#ffffff; --panel2:rgba(244,243,252,.85); --ink:#1d2152; --muted:#5f6590; --line:rgba(46,49,146,.14);
  --accent:#3a3fb8; --accent-ink:#ffffff; --accent2:#f58220;
  --good:#0f8a58; --warn:#b26a00; --bad:#d62c3a; --info:#2a6fd1; --sam:#14935f; --sam-soft:#d9f3e7;
  --shadow:0 1px 2px rgba(46,49,146,.06),0 12px 32px rgba(46,49,146,.09);
  --cs:64%; --cl:87%; --ctext:#1d2152; --cell-empty:rgba(46,49,146,.06);
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif; --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
body{min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* kepala */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand h1{font-size:26px;letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{box-shadow:none;background:transparent}
.chip-state{padding:5px 10px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.chip-state.dirty{color:var(--warn);border-color:var(--warn)}
.chip-state.ok{color:var(--good);border-color:var(--good)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--accent))}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1;margin-top:2px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.bad{--k:var(--bad)} .kpi.warn{--k:var(--warn)} .kpi.good{--k:var(--good)}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;background:var(--cell-empty)}
.split i{display:block;height:100%}

/* tab */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;display:flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:20px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;text-align:center;line-height:18px;background:var(--cell-empty);color:var(--muted)}
.badge.bad{background:var(--bad);color:#fff} .badge.warn{background:var(--warn);color:#fff}

/* susun atur agihan */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:1fr}}
.courses{display:flex;flex-direction:column;gap:14px;min-width:0}
.course{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.course.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.ch{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;background:linear-gradient(90deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line)}
.ch .cid{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.ch h3{font-size:17px;flex:1 1 220px}
.ch .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px}
.ch select,.set select,.set input,.tbl input,.search{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.ch label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}
.pill{border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.gridwrap{overflow-x:auto;padding:12px 14px 14px}
.grid{display:grid;grid-template-columns:70px repeat(var(--n),minmax(72px,1fr));gap:4px;min-width:calc(70px + var(--n)*76px)}
.rl{align-self:center;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sec{text-align:center;font-weight:800;color:var(--muted);font-size:12px}
.stu{text-align:center;color:var(--muted);font-size:12px}
.cell{position:relative;min-height:44px;border-radius:9px;padding:5px 6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12.5px;line-height:1.2;
  border:1.5px solid transparent;user-select:none;touch-action:none;transition:transform .08s,filter .12s;word-break:break-word}
.cell.lc{background:hsl(var(--h) var(--cs) var(--cl));color:var(--ctext)}
.cell.empty{background:var(--cell-empty);color:var(--muted);border:1.5px dashed var(--line);font-weight:600}
.cell.k{min-height:50px}
.cell:hover{filter:brightness(1.06);border-color:var(--accent)}
.cell.ex{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.cell.dim{opacity:.28}
.cell.jsm{background:#cfe2f7;color:#14325e;cursor:default}
.cell .cp{position:absolute;right:3px;top:2px;border:0;background:rgba(255,255,255,.35);color:inherit;border-radius:6px;font-size:10px;padding:0 4px;line-height:15px;opacity:0;transition:opacity .1s}
.cell:hover .cp,.cell .cp:focus-visible{opacity:1}
body.painting .cell:not(.jsm){cursor:crosshair}
.hint{color:var(--muted);font-size:12px;padding:0 14px 12px}

/* bar sisi */
.side{position:sticky;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100vh - 20px);display:flex;flex-direction:column;min-width:0}
@media (max-width:1050px){.side{position:static;max-height:none}}
.sh{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sh h2{font-size:16px}
.search{width:100%}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.brushinfo{font-size:12.5px;padding:7px 9px;border-radius:9px;background:var(--panel2);border:1px dashed var(--line);color:var(--muted)}
.brushinfo b{color:var(--ink)}
.list{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.lrow{display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;background:transparent;text-align:left;width:100%}
.lrow:hover{background:var(--panel2)}
.lrow[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.dot{width:12px;height:12px;border-radius:4px;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid rgba(0,0,0,.18)}
.dot.era{background:transparent;border:1.5px dashed var(--muted)}
.lname{font-weight:700;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.lsub{grid-column:2;color:var(--muted);font-size:11.5px}
.lh{grid-row:1;grid-column:3;font-weight:800;text-align:right}
.lh small{color:var(--muted);font-weight:600}
.lh.bad{color:var(--bad)} .lh.good{color:var(--good)} .lh.warn{color:var(--warn)}
.bar{grid-column:1/-1;position:relative;height:6px;background:var(--cell-empty);border-radius:99px;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent2)}
.bar.bad i{background:var(--bad)} .bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7;border-radius:2px;text-decoration:none}
.tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:0 5px;background:var(--cell-empty);color:var(--muted);line-height:16px}
.tag.star{background:var(--accent);color:var(--accent-ink)}
.tag.s1{background:transparent;border:1px solid var(--line)}
.tag.warn{color:var(--warn);border:1px solid var(--warn);background:transparent}

/* popover */
.pop{position:fixed;z-index:50;width:290px;max-height:min(420px,70vh);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:6px}
.pop h4{margin:6px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pop button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left}
.pop button:hover{background:var(--panel2)}
.pop .sub{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.pop .x{color:var(--warn)}

/* jadual */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px;min-width:0}
.card h2{font-size:18px;margin-bottom:8px}
.tw{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;min-width:760px}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:hover td{background:var(--panel2)}
.tbl input[type=number]{width:70px}
.cbar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--cell-empty);position:relative;min-width:160px}
.cbar i{display:block;height:100%}
.cbar .kk{background:var(--accent)} .cbar .aa{background:var(--accent2)}
.cbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin:6px 0 10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* semakan */
.issue{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background:var(--panel2)}
.issue .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
.issue.bad .ic{background:var(--bad)} .issue.warn .ic{background:var(--warn)} .issue.info .ic{background:var(--info)} .issue.ok .ic{background:var(--good)}
.issue .go{margin-left:auto}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.set label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12.5px;font-weight:600}
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pairs .pill button{border:0;background:transparent;color:inherit;font-weight:900;margin-left:4px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:80;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.35);font-weight:600}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.addc>summary{list-style:none}
details.addc>summary::-webkit-details-marker{display:none}
details.addc:not([open])>summary::after{content:"Buka";margin-left:auto;color:var(--accent);font-weight:700}
details.addc[open]>summary::after{content:"Tutup";margin-left:auto;color:var(--accent);font-weight:700}

.sin{width:100%;max-width:74px;text-align:center;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 2px;color:var(--muted);font-size:12px}
.sin:hover,.sin:focus{border-color:var(--accent);background:var(--panel)}
.sin::-webkit-inner-spin-button,.sin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sin{-moz-appearance:textfield;appearance:textfield}

.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;align-self:start;height:100vh;padding:16px 10px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nbrand{display:flex;flex-direction:column;padding:2px 10px 14px}
.nbrand b{font-family:var(--font-display);font-size:19px;letter-spacing:-.01em}
.nbrand small{color:var(--muted)}
.ni{display:flex;gap:10px;align-items:center;padding:9px 10px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-weight:700;text-align:left;width:100%}
.ni:hover{background:var(--panel2);color:var(--ink)}
.ni svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ni[aria-current="page"]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.ni .badge{margin-left:auto}
.nfoot{margin-top:auto;padding:10px;color:var(--muted);font-size:12px}
.main{padding:16px 18px;min-width:0}
.pbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:14px}
.pbar .bt{flex:1 1 260px}
.pbar h1{font-size:25px;letter-spacing:-.02em}
.pbar p{margin:2px 0 0;color:var(--muted)}
.mini{display:flex;gap:6px}
.mini .pill b{color:var(--ink)}
.cfbar{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.hrow{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 68px;gap:8px;align-items:center;padding:3px 0}
.hrow .bar{margin:0;grid-column:auto}
.hn{font-weight:700;font-size:13px}
.hv{text-align:right;font-size:12.5px;color:var(--muted)}
.hv.bad{color:var(--bad)} .hv.good{color:var(--good)} .hv.warn{color:var(--warn)}
.hv b{color:inherit}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .nbrand,.nfoot{display:none}
  .ni span:not(.badge){white-space:nowrap}
  .main{padding:12px}
}


/* ===== tema lembut, animasi, sambilan ===== */
html,body{background:var(--bg)}
#root{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(135deg,#f3f2fb 0%,#fbf5ef 55%,#f4f2fb 100%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.6}
.bgfx .b1{width:560px;height:560px;left:-140px;top:-100px;background:#c6caf6;animation:fl1 28s ease-in-out infinite alternate}
.bgfx .b2{width:500px;height:500px;right:-120px;top:10%;background:#ffd8b6;animation:fl2 32s ease-in-out infinite alternate}
.bgfx .b3{width:460px;height:460px;left:34%;bottom:-170px;background:#ffc6c0;animation:fl3 36s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(180px,140px) scale(1.18)}}
@keyframes fl2{to{transform:translate(-160px,120px) scale(.9)}}
@keyframes fl3{to{transform:translate(-200px,-90px) scale(1.2)}}
select,input:not([type=checkbox]):not([type=file]){background:var(--panel-solid)}
.pop{background:var(--panel-solid)}
.card,.course,.kpi,.side,.nav,.btn{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav{background:rgba(255,255,255,.66)}
.btn.primary{background:linear-gradient(120deg,#2e3192,#4a4fc4);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(46,49,146,.28)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn{transition:transform .12s,box-shadow .15s,border-color .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.ch{background:linear-gradient(90deg,rgba(46,49,146,.07),rgba(245,130,32,.07))}
.course,.card,.kpi{transition:box-shadow .2s,transform .2s}
.course:hover,.card:hover{box-shadow:0 2px 4px rgba(46,49,146,.07),0 16px 38px rgba(46,49,146,.12)}
.ni[aria-current="page"]{background:linear-gradient(90deg,rgba(46,49,146,.12),rgba(245,130,32,.10));box-shadow:inset 3px 0 0 var(--orange)}
.ni{transition:background .15s,color .15s}
.kpi::before{background:linear-gradient(180deg,var(--k,var(--indigo)),var(--orange))}
.kpi .v{color:var(--navy)}
.cell{transition:transform .1s,filter .12s,box-shadow .15s}
.cell:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(46,49,146,.16)}
.cell.lc.sam{background:repeating-linear-gradient(135deg,hsl(var(--h) var(--cs) var(--cl)) 0 8px,hsl(var(--h) var(--cs) calc(var(--cl) - 8%)) 8px 16px);border:1.5px dashed var(--sam)}
.cell.sam::before{content:"S";position:absolute;left:3px;top:2px;font-size:9px;font-weight:900;line-height:14px;padding:0 5px;border-radius:5px;background:var(--sam);color:#fff}
.tag.sambtag{background:var(--sam);color:#fff;letter-spacing:.04em}
.tag.tetap{background:rgba(46,49,146,.09);color:var(--navy)}
.lrow.sam{background:linear-gradient(90deg,rgba(20,147,95,.12),transparent 75%);border-left:3px solid var(--sam)}
.lrow.sam[aria-pressed="true"]{border-color:var(--sam);border-left-width:3px}
.lgrp{margin:8px 6px 2px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);display:flex;gap:6px;align-items:center}
.lgrp b{background:var(--cell-empty);border-radius:99px;padding:0 7px;line-height:17px}
.lgrp.sam{color:var(--sam)} .lgrp.sam b{background:var(--sam-soft)}
.hrow.sam .hn{color:var(--sam)}
tr.sam td{background:rgba(20,147,95,.07)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12px;margin:-4px 0 12px}
.legend2 .lg{display:inline-block;width:18px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.lg.tetapi{background:hsl(250 64% 87%)}
.lg.samb{background:repeating-linear-gradient(135deg,hsl(140 64% 87%) 0 4px,hsl(140 64% 79%) 4px 8px);border:1.5px dashed var(--sam)}
.lg.exc{background:transparent;border:2px solid var(--warn)}
.ring{position:absolute;right:12px;top:12px;width:46px;height:46px;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:var(--cell-empty);stroke-width:5}
.ring .rf{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-dasharray:calc(var(--p)*113.1) 113.1;animation:ringin 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringin{from{stroke-dasharray:0 113.1}}
.bar i{transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar.good i{background:linear-gradient(90deg,#34c28a,var(--good))}
.bar i{background:linear-gradient(90deg,var(--amber),var(--orange))}
.cbar .kk{background:linear-gradient(90deg,#6a6fe0,var(--indigo))} .cbar .aa{background:linear-gradient(90deg,var(--amber),var(--orange))}

/* animasi masuk halaman */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter .kpi,.enter .card,.enter .course,.enter .cfbar,.enter .legend2,.enter .side,.enter .issue{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.enter .kpis .kpi:nth-child(2){animation-delay:.06s}.enter .kpis .kpi:nth-child(3){animation-delay:.12s}.enter .kpis .kpi:nth-child(4){animation-delay:.18s}.enter .kpis .kpi:nth-child(5){animation-delay:.24s}
.enter .two .card:nth-child(2){animation-delay:.1s}.enter .card:nth-last-child(1){animation-delay:.16s}
.enter .courses .course:nth-child(1){animation-delay:.04s}.enter .courses .course:nth-child(2){animation-delay:.1s}.enter .courses .course:nth-child(3){animation-delay:.16s}.enter .courses .course:nth-child(4){animation-delay:.22s}.enter .courses .course:nth-child(n+5){animation-delay:.28s}
.enter .bar i,.enter .cbar i,.enter .split i{transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both .2s}

/* banner institusi: logo lutsinar di atas latar lembut */
.bbanner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;margin-bottom:16px;padding:16px 24px 24px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);background:linear-gradient(110deg,rgba(255,255,255,.9),rgba(255,248,242,.9) 55%,rgba(255,241,238,.9));background-size:200% 100%;animation:sheen 22s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.bbanner::before,.bbanner::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.bbanner::before{width:420px;height:420px;right:-90px;top:-210px;background:radial-gradient(circle,rgba(245,130,32,.26),transparent 66%);animation:drift 15s ease-in-out infinite alternate}
.bbanner::after{width:440px;height:440px;left:-120px;bottom:-250px;background:radial-gradient(circle,rgba(46,49,146,.2),transparent 66%);animation:drift 19s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,36px) scale(1.14)}}
.bbanner>*{position:relative;z-index:1}
.logo{display:block;background-repeat:no-repeat;background-position:center;background-size:contain;filter:drop-shadow(0 4px 10px rgba(46,49,146,.12))}

.bbanner.intro .logo.ppd{animation:slidel .9s cubic-bezier(.2,.7,.2,1) backwards}
.bbanner.intro .logo.jtm{animation:slider .9s cubic-bezier(.2,.7,.2,1) backwards .1s}
.bbanner.intro .btext{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards .2s}
@keyframes slidel{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.btext{flex:1 1 260px;text-align:center;line-height:1.3}
.btext b{display:block;font-family:var(--font-display);font-size:23px;letter-spacing:-.015em;background:linear-gradient(100deg,#2e3192 20%,#4a4fc4 55%,#ee3124 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btext span{font-size:12.5px;color:var(--muted)}
.pxs{position:absolute!important;left:24px;right:24px;bottom:7px;display:flex;gap:4px;z-index:1}
.pxs i{flex:1;max-width:16px;height:7px;border-radius:2px;background:hsl(calc(4 + var(--i)*1.2) 92% 58%);animation:pulse 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*75ms)}
@keyframes pulse{0%,100%{opacity:.22;transform:scaleY(.55)}50%{opacity:1;transform:scaleY(1.25)}}
@media (max-width:760px){.btext{order:3;flex-basis:100%}.logo.ppd{height:42px}.logo.jtm{height:50px}.btext b{font-size:17px}.bbanner{padding:12px 14px 20px}.pxs{left:14px;right:14px}}
@media (prefers-reduced-motion:reduce){.bgfx i,.bbanner,.bbanner::before,.bbanner::after,.pxs i{animation:none!important}}

.cell.sam{padding-top:16px}
.cell.sam.k{padding-top:14px}
.cpick{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;margin-left:auto}
.cfbar{align-items:center}
.hrow{grid-template-columns:132px minmax(0,1fr) 68px}

/* ===== lapisan interaktif dan animasi tambahan ===== */
.bgfx .pt{position:absolute;bottom:-40px;width:var(--s);height:var(--s);border-radius:3px;background:var(--c);opacity:0;animation:floatup var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes floatup{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:.34}85%{opacity:.22}100%{transform:translateY(-118vh) rotate(320deg);opacity:0}}
.bgfx .spot{width:520px;height:520px;left:var(--sx,60vw);top:var(--sy,30vh);margin:-260px 0 0 -260px;background:rgba(255,255,255,.95);opacity:.55;transition:left .4s ease-out,top .4s ease-out}
.bbanner .logo.ppd{transform:translate(calc(var(--mx,0)*-10px),calc(var(--my,0)*-6px));transition:transform .25s ease-out}
.bbanner .logo.jtm{transform:translate(calc(var(--mx,0)*10px),calc(var(--my,0)*6px)) rotate(calc(var(--mx,0)*1.5deg));transition:transform .25s ease-out}
.bbanner .btext{transform:translate(calc(var(--mx,0)*4px),calc(var(--my,0)*2px));transition:transform .25s ease-out}
.pxs i{transition:transform .15s,opacity .15s}
.pxs i:hover{transform:scaleY(2.6)!important;opacity:1!important}
.pxs i:hover + i,.pxs i:has(+ i:hover){transform:scaleY(1.9)!important;opacity:1!important}
.kpi{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .2s;will-change:transform}
.kpi::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.75),transparent 55%);opacity:0;transition:opacity .2s}
.kpi.tilt{box-shadow:0 18px 40px rgba(46,49,146,.2)}
.kpi.tilt::after{opacity:.9}
.nav{position:sticky}
.nind{position:absolute;left:10px;right:10px;top:0;height:40px;border-radius:10px;pointer-events:none;background:linear-gradient(90deg,rgba(46,49,146,.13),rgba(245,130,32,.12));box-shadow:inset 3px 0 0 var(--orange);transition:transform .38s cubic-bezier(.2,.9,.25,1.1),height .3s}
.ni{position:relative;z-index:1}
.ni[aria-current="page"]{background:transparent;box-shadow:none;color:var(--ink)}
.ni:hover{background:rgba(46,49,146,.06)}
.ni svg{transition:transform .2s}
.ni:hover svg,.ni[aria-current="page"] svg{transform:scale(1.14)}
@media (max-width:860px){.nind{display:none}.ni[aria-current="page"]{background:linear-gradient(90deg,rgba(46,49,146,.13),rgba(245,130,32,.12));box-shadow:inset 0 -3px 0 var(--orange)}}
.btn,.lrow,.seg button{position:relative;overflow:hidden}
.ni{overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .65s ease-out forwards}
.btn:not(.primary) .rip,.lrow .rip,.seg button .rip,.ni .rip{background:rgba(46,49,146,.16)}
@keyframes rip{to{transform:scale(1);opacity:0}}
.cell.cpop{animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.cell.cpop::after{content:"";position:absolute;inset:-2px;border-radius:11px;border:2px solid var(--accent);pointer-events:none;animation:ripring .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ripring{from{transform:scale(1);opacity:.9}to{transform:scale(1.28);opacity:0}}
.cell.hl{box-shadow:0 0 0 2px var(--accent),0 8px 18px rgba(46,49,146,.25);animation:glow 1.1s ease-in-out infinite alternate;z-index:2}
@keyframes glow{to{box-shadow:0 0 0 3px var(--orange),0 10px 24px rgba(245,130,32,.32)}}
.cell.dim{transition:opacity .18s}
.lrow.lit{background:var(--panel2)}
.cell[draggable="true"]{cursor:grab}
.cell.dragsrc{opacity:.4;transform:scale(.94)}
.cell.dropok{outline:2.5px dashed var(--orange);outline-offset:2px;background-color:rgba(245,130,32,.14);transform:scale(1.04)}
body.dragging .cell[data-cell]:not(.dropok){animation:wiggle .5s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.lrow[draggable="true"]{cursor:grab}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
.toast{animation:toastin .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,18px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.issue{transition:transform .15s}
.issue:hover{transform:translateX(3px)}
.pill{transition:transform .15s}
.pill:hover{transform:translateY(-1px)}
.kpi .v span{display:inline-block}
@media (prefers-reduced-motion:reduce){.bgfx .pt,.cell.hl,body.dragging .cell{animation:none!important}.kpi{transform:none!important}}

.lrow{flex:none}
.list>*{flex:none}

/* ---------- tenaga pengajar ---------- */
.tsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tlayout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.tside{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;max-height:calc(100vh - 24px)}
.tlist{display:flex;flex-direction:column;gap:5px;overflow:auto;min-height:0;padding-right:2px}
.trow{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:7px 9px;flex:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.trow:hover{transform:translateX(3px);box-shadow:0 4px 12px rgba(46,49,146,.12)}
.trow.sel{border-color:var(--indigo);background:linear-gradient(90deg,rgba(74,79,196,.12),transparent 90%);box-shadow:inset 3px 0 0 var(--indigo)}
.tav{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 58%),hsl(calc(var(--h) + 30) 58% 44%));box-shadow:0 2px 6px hsl(var(--h) 50% 40% / .35)}
.tav.big{width:64px;height:64px;font-size:22px}
.tnm{display:flex;flex-direction:column;min-width:0;flex:1}
.tnm b{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnm small{font-size:11px;color:var(--muted)}
.th{font-weight:800;font-size:12px;color:var(--navy)}
.tchip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-style:normal}
.tchip.pen{background:rgba(245,130,32,.14);border-color:rgba(245,130,32,.45);color:#a55200}
.tchip.ok{background:rgba(15,138,88,.1);border-color:rgba(15,138,88,.35);color:var(--good)}
.tchip.ex{background:rgba(178,106,0,.1);border-color:rgba(178,106,0,.4);color:var(--warn)}
.tchip.away{background:rgba(42,111,209,.1);border-color:rgba(42,111,209,.35);color:var(--info)}
.tchip.res{background:rgba(74,79,196,.09);border-color:rgba(74,79,196,.3);color:var(--navy)}
.tempty{padding:18px;text-align:center;color:var(--muted)}
.tsamnote{font-size:12px;margin:2px 0 0}
.tsrc{font-size:12px;margin-top:10px}
.tdetail.swap>*{animation:tswap .45s cubic-bezier(.2,.7,.2,1) both}
.tdetail.swap>*:nth-child(2){animation-delay:.05s}.tdetail.swap>*:nth-child(3){animation-delay:.1s}.tdetail.swap>*:nth-child(4){animation-delay:.15s}.tdetail.swap>*:nth-child(5){animation-delay:.2s}.tdetail.swap>*:nth-child(6){animation-delay:.25s}
@keyframes tswap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tdhead{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(120deg,hsl(var(--h) 70% 96%),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.tdname{flex:1;min-width:0}.tdname h2{margin:0 0 6px;font-size:19px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tnote{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.tno{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.tdetail h3{margin:0 0 8px;font-size:14px}
.tload{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:10px}
.tload small{display:block;color:var(--muted);font-size:11.5px}.big2{font-size:30px;color:var(--navy)}
.tbarw .bar{margin:0 0 4px}
.tcl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tc{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:7px 9px}
.tc b{font-size:12px;color:var(--navy)}.tc span{font-size:12.5px;font-weight:600;flex:1 1 100%;order:3}.tc em{font-size:11.5px;color:var(--muted);font-style:normal;flex:1 1 100%;order:4}
.tc i{order:2}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two2>.card{margin-bottom:14px}
.tul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.tul li{padding-left:12px;border-left:3px solid var(--amber)}.tul small{display:block;color:var(--muted);font-size:11.5px}
.tl{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.tl li{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:5px 0 5px 14px;position:relative;border-left:2px solid var(--line)}
.tl li::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--indigo);box-shadow:0 0 0 3px var(--panel)}
.tl .ty{font-size:12px;font-weight:800;color:var(--navy)}.tl small{display:block;color:var(--muted);font-size:12px}
@media (max-width:1050px){.tlayout{grid-template-columns:1fr}.tside{position:static;max-height:none}.tlist{max-height:330px}}
@media (max-width:700px){.two2{grid-template-columns:1fr}.tload{grid-template-columns:1fr}.tl li{grid-template-columns:1fr;gap:0}.tdhead{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){.tdetail.swap>*{animation:none!important}}

/* ---------- Google Sheet ---------- */
.loadingscreen{min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--navy)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(46,49,146,.18);border-top-color:var(--indigo);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner.warnb{background:rgba(245,130,32,.14);border-color:rgba(245,130,32,.5)}
.nfoot{line-height:1.5}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ---------- pengiraan ---------- */
function compute(st) {
  const per = {}, issues = [], coordOf = {}; let unfilled = 0, units = 0;
  const L = lmapOf(st), C = cmap(st);
  st.lecturers.forEach(l => { per[l.id] = { l, kh: 0, ah: 0, kg: 0, as: 0, courses: {}, cover: {} }; });
  st.courses.forEach(c => { if ((c.type === 'teach' || c.type === 'dp') && c.coord) (coordOf[c.coord] = coordOf[c.coord] || []).push(c.kod); });
  const unfilledBy = {};
  teaching(st).forEach(c => {
    const a = st.assign[c.kod], ng = ngOf(c);
    for (let g = 0; g < ng; g++) {
      units++; const id = a.K[g];
      if (!id || !per[id]) { unfilled++; unfilledBy[c.kod] = (unfilledBy[c.kod] || 0) + 1; continue; }
      const o = per[id]; o.kg++; o.kh += c.K;
      const cc = o.courses[c.kod] = o.courses[c.kod] || { k: 0, a: 0 }; cc.k++;
      const cv = o.cover[c.kod] = o.cover[c.kod] || {}; for (let s = g * c.grp; s < Math.min(c.n, (g + 1) * c.grp); s++) cv[s] = 1;
    }
    for (let s = 0; s < c.n; s++) {
      units++; const id = a.A[s];
      if (!id || !per[id]) { unfilled++; unfilledBy[c.kod] = (unfilledBy[c.kod] || 0) + 1; continue; }
      const o = per[id]; o.as++; o.ah += c.TA;
      const cc = o.courses[c.kod] = o.courses[c.kod] || { k: 0, a: 0 }; cc.a++;
      const cv = o.cover[c.kod] = o.cover[c.kod] || {}; cv[s] = 1;
    }
  });
  let total = 0, staffH = 0, samH = 0, samN = 0, atTarget = 0, staffN = 0;
  st.lecturers.forEach(l => {
    const o = per[l.id]; o.hours = o.kh + o.ah; o.nc = Object.keys(o.courses).length;
    if (l.type === 'staf') {
      o.target = (l.target !== null && l.target !== undefined && l.target !== '') ? Number(l.target) : (coordOf[l.id] ? st.set.coordTarget : st.set.target);
      o.cap = o.target; staffH += o.hours; staffN++; if (o.hours === o.target) atTarget++;
    } else { o.target = null; o.cap = st.set.sambilanMax; samH += o.hours; if (o.hours > 0) samN++; }
    total += o.hours;
    o.status = l.type === 'staf' ? (o.hours > o.target ? 'bad' : (o.hours === o.target ? 'good' : 'warn')) : (o.hours > o.cap ? 'bad' : 'plain');
  });
  /* semakan */
  Object.keys(unfilledBy).forEach(k => issues.push({ sev: 'bad', msg: k + ' ' + C[k].nama + ': ' + unfilledBy[k] + ' unit belum diisi (kuliah atau seksyen amali)', c: k }));
  st.lecturers.forEach(l => {
    const o = per[l.id], nm = l.short;
    const maxC = l.type === 'staf' ? st.set.staffCourses : st.set.sambilanCourses;
    if (o.nc > maxC) issues.push({ sev: 'bad', msg: nm + ' mengajar ' + o.nc + ' kursus (maksimum ' + maxC + ')', l: l.id });
    if (l.type === 'staf') {
      if (o.hours > o.target) issues.push({ sev: 'bad', msg: nm + ' melebihi sasaran: ' + o.hours + ' jam (sasaran ' + o.target + ')', l: l.id });
      else if (o.hours < o.target) {
        const d = o.target - o.hours;
        issues.push(l.indep ? { sev: 'info', msg: nm + ' kurang ' + d + ' jam daripada sasaran; disasar untuk kursus independent', l: l.id }
                            : { sev: 'warn', msg: nm + ' kurang ' + d + ' jam daripada sasaran (' + o.hours + ' / ' + o.target + ')', l: l.id });
      }
      if (o.hours > 0 && (o.kg < st.set.kuliahMin || o.kg > st.set.kuliahMax)) issues.push({ sev: 'warn', msg: nm + ' ada ' + o.kg + ' kumpulan kuliah (patut ' + st.set.kuliahMin + ' hingga ' + st.set.kuliahMax + ')', l: l.id });
      Object.keys(o.courses).forEach(k => { if (l.lampiran.indexOf(k) < 0) issues.push({ sev: 'info', msg: nm + ' dalam ' + k + ' ' + C[k].nama + ' di luar lampiran kepakaran', l: l.id, c: k }); });
    } else {
      if (o.hours > o.cap) issues.push({ sev: 'bad', msg: nm + ' (sambilan) ' + o.hours + ' jam, melebihi had ' + o.cap + ' jam', l: l.id });
      if (o.kg > st.set.kuliahMax) issues.push({ sev: 'warn', msg: nm + ' (sambilan) ada ' + o.kg + ' kumpulan kuliah', l: l.id });
    }
    Object.keys(o.cover).forEach(k => {
      const idx = Object.keys(o.cover[k]).map(Number).sort((a, b) => a - b);
      if (idx.length > 1 && idx[idx.length - 1] - idx[0] + 1 !== idx.length) issues.push({ sev: 'warn', msg: nm + ': seksyen bertaburan dalam ' + k + ' (' + idx.map(x => x + 1).join(', ') + ')', l: l.id, c: k });
    });
  });
  st.pairs.forEach(p => {
    const A = per[p[0]], B = per[p[1]]; if (!A || !B) return;
    Object.keys(A.courses).forEach(k => { if (B.courses[k]) issues.push({ sev: 'bad', msg: L[p[0]].short + ' dan ' + L[p[1]].short + ' dalam kursus yang sama (' + k + ')', c: k }); });
  });
  st.courses.forEach(c => {
    if (c.type !== 'teach' && c.type !== 'dp') return;
    const co = c.coord, l = L[co];
    if (!co || !l) { issues.push({ sev: c.indep ? 'info' : 'bad', msg: c.kod + ' ' + c.nama + ' belum ada penyelaras', c: c.kod }); return; }
    if (l.type !== 'staf') issues.push({ sev: 'bad', msg: 'Penyelaras ' + c.kod + ' mesti pensyarah tetap, bukan sambilan (' + l.short + ')', c: c.kod });
    if (c.type === 'teach' && !(per[co].courses[c.kod] && per[co].courses[c.kod].k > 0)) issues.push({ sev: 'warn', msg: l.short + ' penyelaras ' + c.kod + ' tetapi tidak mengajar kuliah kursus itu', c: c.kod });
    if (l.sem1) issues.push({ sev: 'info', msg: l.short + ' penyelaras ' + c.kod + ' sedangkan dia penyelaras dalam Sem 1', c: c.kod });
    if (coordOf[co].length > 1) issues.push({ sev: 'warn', msg: l.short + ' menyelaras ' + coordOf[co].length + ' kursus (' + coordOf[co].join(', ') + ')', c: c.kod });
  });
  const ord = { bad: 0, warn: 1, info: 2 }; issues.sort((a, b) => ord[a.sev] - ord[b.sev]);
  return { per, issues, coordOf, L, C, unfilled, units, total, staffH, samH, samN, atTarget, staffN };
}
